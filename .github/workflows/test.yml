name: Testes de fumaça

# Roda os testes do tests/smoke.js a cada push e pull request, pra pegar
# regressão antes de ir pro ar — antes disso, os testes só existiam se
# alguém lembrasse de rodar "npm test" na própria máquina.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala dependências
        run: npm install

      - name: Instala o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Roda os testes de fumaça
        run: npm test
