name: Build Girls Math APK

on:
  push:
    branches:
      - "**"
    paths:
      - "girls_math/**"
      - ".github/workflows/build-girls-math-apk.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: girls_math
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze

      - name: Rodar testes
        run: flutter test

      - name: Buildar APK (debug)
        run: flutter build apk --debug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: girls-math-debug-apk
          path: girls_math/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
