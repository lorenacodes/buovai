<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso ao painel — Buovai</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="painel.css" />
  <link rel="icon" type="image/png" href="../assets/img/logo-mark.png" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-card__brand">
        <img src="../assets/img/logo-mark.png" alt="" aria-hidden="true" />
        <span>Buovai</span>
      </div>
      <span class="login-card__badge" id="login-badge" hidden>Acesso administrativo</span>
      <h1 id="login-title">Acesso ao painel</h1>
      <p class="login-card__sub" id="login-sub">Digite seu e-mail e senha cadastrados para acessar o painel.</p>

      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="voce@empresa.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="Sua senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-block" id="login-submit">Entrar</button>
      </form>

      <button type="button" class="login-card__link" id="login-toggle-otp">Prefere entrar por link de acesso (e-mail)?</button>

      <div class="status-msg" id="login-status" role="status"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (function () {
      "use strict";

      var form = document.getElementById("login-form");
      var submitBtn = document.getElementById("login-submit");
      var statusEl = document.getElementById("login-status");
      var passwordField = document.getElementById("password");
      var toggleBtn = document.getElementById("login-toggle-otp");
      var otpMode = false;

      function applyMode() {
        if (otpMode) {
          passwordField.closest(".field").hidden = true;
          passwordField.required = false;
          submitBtn.textContent = "Enviar link de acesso";
          toggleBtn.textContent = "Prefere entrar com e-mail e senha?";
        } else {
          passwordField.closest(".field").hidden = false;
          passwordField.required = true;
          submitBtn.textContent = "Entrar";
          toggleBtn.textContent = "Prefere entrar por link de acesso (e-mail)?";
        }
      }

      toggleBtn.addEventListener("click", function () {
        otpMode = !otpMode;
        applyMode();
      });

      var isAdminEntry = new URLSearchParams(window.location.search).get("as") === "admin";
      if (isAdminEntry) {
        document.title = "Acesso administrativo — Buovai";
        document.getElementById("login-badge").hidden = false;
        document.getElementById("login-title").textContent = "Área administrativa da Buovai";
        document.getElementById("login-sub").textContent = "Esta é a área restrita da equipe Buovai — não é o painel do cliente. Entre com seu e-mail e senha de administrador.";
      }

      applyMode();

      function showStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = "status-msg is-visible status-msg--" + kind;
      }

      // Se já tem sessão ativa, manda direto pro painel certo (admin ou cliente).
      window.buovaiClient.auth.getSession().then(async function (res) {
        if (!res.data.session) return;
        var { data: isAdmin } = await window.buovaiClient.rpc("is_admin");
        window.location.href = isAdmin ? "leads.html" : "index.html";
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        if (!email) return;

        submitBtn.disabled = true;

        if (otpMode) {
          submitBtn.textContent = "Enviando...";

          var redirectTo = window.location.origin + window.location.pathname.replace(/login\.html$/, "index.html");

          var { error } = await window.buovaiClient.auth.signInWithOtp({
            email: email,
            options: { emailRedirectTo: redirectTo },
          });

          submitBtn.disabled = false;
          submitBtn.textContent = "Enviar link de acesso";

          if (error) {
            showStatus("Não foi possível enviar o link agora. Tente de novo em instantes.", "error");
            return;
          }

          showStatus("Link enviado! Confira sua caixa de entrada (e o spam) e clique para acessar o painel.", "ok");
          form.reset();
          return;
        }

        var password = passwordField.value;
        submitBtn.textContent = "Entrando...";

        var { data: signInData, error: signInError } = await window.buovaiClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";

        if (signInError) {
          showStatus("E-mail ou senha incorretos.", "error");
          return;
        }

        var { data: isAdmin } = await window.buovaiClient.rpc("is_admin");
        window.location.href = isAdmin ? "leads.html" : "index.html";
      });
    })();
  </script>
</body>
</html>
