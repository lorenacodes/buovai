  function save(fn, toast, remote) {

        clearTimeout(toastTimer);

      S.toast = "Não foi possível salvar agora. Tente de novo.";

  // primeiro login), mas sem caracteres ambíguos (0/O, 1/l/I) pra não
  // dar erro de digitação ao copiar do PDF pro campo de senha.
  function genTempPassword() {
    var UP = "ABCDEFGHJKLMNPQRSTUVWXYZ", LO = "abcdefghjkmnpqrstuvwxyz", NUM = "23456789", SYM = "!@#$%&*";
    var ALL = UP + LO + NUM + SYM;
    var randInt = function (max) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max; };
    var pick = function (set) { return set.charAt(randInt(set.length)); };
    var pw = [pick(UP), pick(LO), pick(NUM), pick(SYM)];
    for (var i = 0; i < 8; i++) pw.push(pick(ALL));
    for (var j = pw.length - 1; j > 0; j--) { var k = randInt(j + 1); var t = pw[j]; pw[j] = pw[k]; pw[k] = t; }
    return pw.join("");
  }

  function buildProjDet(V) {
    var info = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)">' + V.pdInfo.map(function (i) {
      return '<div style="padding:14px 16px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">' + esc(i.l) + '</span><span style="font-size:14px;font-weight:600;font-variant-numeric:tabular-nums">' + esc(i.v) + "</span></div>";
    }).join("") + "</div>";
    var access = '<div style="display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-top:0">'
      + '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">'
      + '<div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">Acesso do cliente ao portal</span><span style="font-size:14px">' + (V.accessEmail ? esc(V.accessEmail) : "Sem e-mail cadastrado nesse cliente") + "</span></div>"
      + '<button ' + h(V.genAccessH) + ' style="padding:10px 14px;border:1px solid var(--line2);background:none;color:var(--ink);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer" ' + (V.accessBusy ? "disabled" : "") + '>' + (V.accessBusy ? "Gerando…" : "Gerar senha temporária") + "</button>"

            + '<button ' + h(V.printWelcomeH) + ' style="padding:10px 14px;border:0;background:var(--btnBg);color:var(--btnFg);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer">Imprimir PDF de boas-vindas</button>'

    var tabs = '<div style="display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);font-family:\'Lexend Exa\',sans-serif;font-size:12px">' + V.pTabs.map(function (t) { return '<button ' + h(t.h) + ' style="padding:11px 14px;border:0;border-bottom:2px solid ' + t.bd + ';cursor:pointer;font:inherit;background:none;color:' + t.fg + ';margin-bottom:-1px">' + esc(t.label) + "</button>"; }).join("") + "</div>";
    var statusOpts = '<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--mute)">' + V.statusOpts.map(function (o) { return '<button ' + h(o.h) + ' style="padding:7px 10px;font-size:12px;cursor:pointer;border:1px solid ' + o.bd + ";background:" + o.bg + ";color:" + o.fg + '">' + esc(o.label) + "</button>"; }).join("") + "</div>";
    var head = '<div style="display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:center">' + tabs + statusOpts + "</div>";

    if (V.pt_tarefas) {
      var tasks = V.tasks.map(function (t) {

          + '<button ' + h(t.addItem) + ' style="padding:8px 12px;border:1px solid var(--line2);background:none;color:var(--ink2);font-family:\'Lexend Exa\',sans-serif;font-size:10.5px;cursor:pointer">Adicionar tarefa</button>'

          + '<span style="font-size:11px;color:var(--mute)">' + esc(t.when) + "</span>"

        + '<button ' + h(V.addTask) + ' style="padding:10px 14px;border:1px solid var(--line2);background:none;color:var(--ink);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer">Adicionar</button>'
        + '<button ' + h(V.saveAsTpl) + ' style="padding:10px 14px;border:0;background:none;color:var(--accTxt);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer">Salvar etapas como modelo</button>'

    } else if (V.pt_docs) {
      var docs = V.docs.map(function (d) {

      }).join("");
      var opts = V.docTipos.map(function (o) { return '<option value="' + o + '"' + (o === V.newDocTipo ? " selected" : "") + ">" + o + "</option>"; }).join("");
      body = '<div style="display:flex;flex-direction:column">' + docs
        + '<div style="display:flex;gap:8px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap">'
        + '<input value="' + esc(V.newDoc) + '" data-ch="' + V.newDocCh + '" placeholder="Nome do documento" style="flex:1 1 240px;background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:10px 12px;font:inherit;font-size:13px;outline:none">'
        + '<select data-ch="' + V.newDocTipoCh + '" style="background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:10px;font:inherit;font-size:13px">' + opts + "</select>"
        + '<button ' + h(V.addDoc) + ' style="padding:10px 14px;border:1px solid var(--line2);background:none;color:var(--ink);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer">Anexar</button>'
        + "</div></div>";
    } else if (V.pt_fin) {
      body = '<div style="display:flex;flex-direction:column">' + V.parcelas.map(function (q) {
        return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:center;padding:13px 0;border-top:1px solid var(--line)"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:11px;font-variant-numeric:tabular-nums">' + esc(q.n) + '</span><span style="font-size:14px;font-variant-numeric:tabular-nums">' + esc(q.valor) + '</span><span style="font-size:12px;color:var(--mute)">vence ' + esc(q.venc) + '</span><span><span style="font-size:11px;font-weight:600;padding:4px 8px;background:' + q.chipBg + ";color:" + q.chipFg + '">' + esc(q.chip) + '</span></span><button ' + h(q.h) + ' style="justify-self:end;padding:7px 11px;border:1px solid var(--line2);background:none;color:var(--ink);font-size:12px;cursor:pointer">' + esc(q.btn) + "</button></div>";
      }).join("") + "</div>";
    } else if (V.pt_hist) {
      body = '<div style="display:flex;flex-direction:column">' + V.hist.map(function (hh) {
        return '<div style="display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:13px"><span style="color:var(--mute);font-variant-numeric:tabular-nums">' + esc(hh.at) + '</span><span><strong style="font-weight:600">' + esc(hh.who) + "</strong> " + esc(hh.text) + "</span></div>";
      }).join("") + "</div>";

    return info + access + head + body;

  function buildClientes(V) {
    var rows = V.clientes.map(function (c) {

    }).join("");
    return '<div style="display:flex;flex-direction:column">' + rows + (V.emptyList ? '<span style="padding:22px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)">Nenhum cliente encontrado.</span>' : "") + "</div>";

  function buildFunil(V) {
    return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;align-items:start">' + V.funil.map(function (col) {

          + (l.canNext ? '<button ' + h(l.nextH) + ' style="flex:1;padding:7px 10px;border:1px solid var(--line2);background:none;color:var(--accTxt);font-size:12px;cursor:pointer">' + esc(l.nextLabel) + "</button>" : "")

  // Balõezinhos desenhados em CSS (sem emoji — a Lorena não gosta), ao
  // bater a meta semanal de prospecção ou fechar um cliente novo. Só
  // retorna os <span>, quem chama decide o wrapper (tamanho/duração).
  var BALLOON_COLORS = ["var(--bar)", "var(--okFg)", "var(--warnFg)", "var(--ink)"];
  function buildBalloons(count) {
    var spans = [];
    for (var i = 0; i < count; i++) {
      var left = Math.round(Math.random() * 96) + 1;
      var delay = (Math.random() * 1.4).toFixed(2);
      var drift = Math.round((Math.random() - 0.5) * 160);
      var rot = Math.round((Math.random() - 0.5) * 24);
      var color = BALLOON_COLORS[i % BALLOON_COLORS.length];
      spans.push('<span style="left:' + left + '%;animation-delay:' + delay + 's;--bx:' + drift + 'px;--br:' + rot + 'deg"><i style="display:block;width:30px;height:38px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:' + color + '"></i><i style="display:block;width:1px;height:26px;margin:0 auto;background:' + color + ';opacity:.6"></i></span>');
    }
    return spans.join("");
  }

  function buildProspeccao(V) {
    if (V.v_zFicha) return buildZFicha(V);
    var balloons = V.zCelebrate ? '<div id="zCelebrate">' + buildBalloons(16) + "</div>" : "";
    var goal = balloons + '<div style="padding:14px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;margin-bottom:16px">'
      + '<span style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">Meta da semana' + (V.zAcceptBoosted ? " (dobrada)" : "") + '</span><span style="font-size:13px;font-weight:600;color:' + (V.zWeekDone ? "var(--accTxt)" : "var(--ink)") + '">' + V.zWeekCount + " de " + V.zWeekGoal + "</span></span>"
      + '<span style="height:5px;background:var(--barBg)"><span style="display:block;height:100%;width:' + V.zWeekPct + '%;background:var(--bar)"></span></span>'
      + '<span style="font-size:11.5px;color:var(--mute)">Taxa de aceitação (respondeu ou converteu de quem foi contatado): ' + V.zAcceptRate + '% de ' + V.zContactedCount + ' contatados' + (V.zHasSample ? "" : " (ainda abaixo da amostra mínima de " + V.zMinSample + " pra valer pra meta)") + '. Abaixo de ' + V.zAcceptThreshold + '%, a meta dobra.</span>'
      + "</div>";
    var rows = V.prospeccao.map(function (z) {
      return '<button ' + h(z.h) + ' style="width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 20px;align-items:center;padding:15px 0">'
        + '<span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">' + esc(z.nome) + (z.hasSite ? ' <span title="Tem site" style="font-size:10px;font-weight:600;color:var(--mute);border:1px solid var(--line2);padding:1px 5px;vertical-align:middle">site</span>' : "") + '</span><span style="font-size:12px;color:var(--mute)">' + esc(z.setor) + " · " + esc(z.local) + "</span></span>"
        + '<span style="display:flex;flex-direction:column;gap:3px;font-size:13px"><span>' + esc(z.acao) + '</span><span style="color:var(--mute)">' + esc(z.quando) + "</span></span>"
        + '<span style="display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)"><span>cadastrada em</span><span>' + esc(z.criadoEm || "—") + "</span>" + (z.prazoLabel ? '<span style="color:' + (z.prazoOverdue ? "var(--badFg)" : "var(--mute)") + '">' + esc(z.prazoLabel) + "</span>" : "") + "</span>"
        + '<span style="justify-self:end;display:flex;gap:6px">' + (z.hasPrio ? '<span style="font-size:11px;font-weight:600;padding:4px 8px;background:' + z.prioBg + ";color:" + z.prioFg + '">' + esc(z.prioridade) + "</span>" : "") + '<span style="font-size:11px;font-weight:600;padding:4px 8px;background:' + z.chipBg + ";color:" + z.chipFg + '">' + esc(z.status) + "</span></span>"
        + "</button>";
    }).join("");
    return '<div style="display:flex;flex-direction:column">' + goal + rows + (V.emptyList ? '<span style="padding:22px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)">Nenhuma prospecção ainda. Comece registrando quem você quer conquistar.</span>' : "") + "</div>";
  }

  // "Ficha" da prospecção: página própria de detalhe, no mesmo espírito
  // do detalhe de projeto — a Lorena não queria mais ver isso como um
  // modal flutuando por cima da lista.
  function buildZFicha(V) {
    // Cada campo vira uma linha (rótulo à esquerda, valor com espaço de
    // verdade à direita) — a Lorena achou que espremer tudo lado a lado
    // em colunas estreitas cortava texto e não parecia uma ficha real.
    var fields = '<div style="display:flex;flex-direction:column;border-top:1px solid var(--line)">' + V.zEditFields.map(function (f) {
      var label = '<span style="width:170px;flex:none;font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">' + esc(f.l) + "</span>";
      var inner;
      if (f.kind === "readonly") inner = '<span style="font-size:14.5px;font-weight:600;padding:9px 0">' + esc(f.value) + "</span>";
      else if (f.kind === "select") inner = '<select data-ch="' + f.chH + '" data-field="' + esc(f.key) + '" style="background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;font-weight:600;width:100%;max-width:420px;cursor:pointer">' + f.options.map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.v === f.value ? " selected" : "") + ">" + esc(o.l) + "</option>"; }).join("") + "</select>";
      else inner = '<input type="' + f.type + '" value="' + esc(f.value) + '" data-ch="' + f.chH + '" data-blurh="' + f.blurH + '" data-field="' + esc(f.key) + '" style="background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;font-weight:600;width:100%;max-width:420px">';
      return '<label style="padding:11px 4px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);cursor:text">' + label + inner + "</label>";
    }).join("") + "</div>";
    var flagChip = function (on, label, onLabel, hid) {
      return '<button ' + h(hid) + ' style="padding:8px 14px;border:1px solid ' + (on ? "var(--accTxt)" : "var(--line2)") + ';background:' + (on ? "var(--accSoft)" : "none") + ";color:" + (on ? "var(--accTxt)" : "var(--ink)") + ';font-family:\'Lexend Exa\',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px">' + (on ? "✓ " : "") + esc(on ? onLabel : label) + "</button>";
    };
    var flags = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      + flagChip(V.zContatado, "Marcar como contatado", "Já entrei em contato", V.zContatadoH)
      + flagChip(V.zReuniao, "Marcar reunião/ligação agendada", "Reunião/ligação agendada", V.zReuniaoH)
      + (V.zPrazoLabel ? '<span style="font-size:11.5px;color:' + (V.zPrazoOverdue ? "var(--badFg)" : "var(--mute)") + '">' + esc(V.zPrazoLabel) + "</span>" : "")
      + "</div>";
    var actions = '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + (V.zWaUrl ? '<a href="' + esc(V.zWaUrl) + '" target="_blank" rel="noopener" style="padding:11px 16px;border:1px solid var(--line2);background:none;color:var(--ink);font-family:\'Lexend Exa\',sans-serif;font-size:12px;cursor:pointer;text-decoration:none">Chamar no WhatsApp</a>' : "")
      + (V.zSiteUrl ? '<a href="' + esc(V.zSiteUrl) + '" target="_blank" rel="noopener" style="padding:11px 16px;border:1px solid var(--line2);background:none;color:var(--ink);font-family:\'Lexend Exa\',sans-serif;font-size:12px;cursor:pointer;text-decoration:none">Ver site</a>' : "")
      + (V.zCanConvert ? '<button ' + h(V.zConvertH) + ' style="padding:11px 16px;border:0;background:var(--btnBg);color:var(--btnFg);font-family:\'Lexend Exa\',sans-serif;font-size:12px;font-weight:600;cursor:pointer">Converter em cliente</button>' : "")
      + "</div>";
    var area = function (label, f) {
      return '<label style="display:flex;flex-direction:column;gap:6px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">' + esc(label) + '</span><textarea data-ch="' + f.chH + '" data-blurh="' + f.blurH + '" data-field="' + esc(f.key) + '" rows="4" placeholder="Nada registrado ainda." style="background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:11px 13px;font:inherit;font-size:14px;outline:none;width:100%;resize:vertical">' + esc(f.value) + "</textarea></label>";
    };
    return '<div style="display:flex;flex-direction:column;gap:24px">' + fields + flags + actions + area("Estratégia", V.zEstrategiaField) + area("Dor percebida", V.zDorField) + "</div>";

  function buildPropostas(V) {
    var rows = V.propostas.map(function (p) {
      var ans = p.canAnswer ? '<button ' + h(p.approveH) + ' style="padding:7px 12px;border:0;background:var(--btnBg);color:var(--btnFg);font-size:12px;font-weight:600;cursor:pointer">Aprovar</button><button ' + h(p.refuseH) + ' style="padding:7px 12px;border:1px solid var(--line2);background:none;color:var(--ink);font-size:12px;cursor:pointer">Recusar</button>' : "";
      return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 20px;align-items:center;padding:15px 0;border-top:1px solid var(--line)"><span style="display:flex;flex-direction:column;gap:3px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accTxt)">' + esc(p.tipo) + '</span><span style="font-size:14px;font-weight:600">' + esc(p.titulo) + '</span></span><span style="font-size:12px;color:var(--mute)">' + esc(p.cliente) + " · enviada " + esc(p.data) + '</span><span style="font-family:\'Lexend Exa\',sans-serif;font-size:13px;font-variant-numeric:tabular-nums">' + esc(p.valor) + '</span><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span style="font-size:11px;font-weight:600;padding:4px 8px;background:' + p.chipBg + ";color:" + p.chipFg + '">' + esc(p.status) + "</span>" + ans + "</span></div>";
    }).join("");
    return '<div style="display:flex;flex-direction:column">' + rows + (V.emptyList ? '<span style="padding:22px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)">Nada por aqui.</span>' : "") + "</div>";
  }

  function buildFinanceiro(V) {
    var kpis = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)">' + V.kpis.map(function (s) {
      return '<div style="padding:18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">' + esc(s.label) + '</span><span style="font-family:\'Lexend Exa\',sans-serif;font-size:20px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:' + s.color + '">' + esc(s.val) + '</span><span style="font-size:12px;color:var(--mute)">' + esc(s.sub) + "</span></div>";
    }).join("") + "</div>";
    var rows = V.finRows.map(function (r) {
      return '<button ' + h(r.h) + ' style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 20px;align-items:center;padding:15px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer"><span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">' + esc(r.cliente) + '</span><span style="font-size:12px;color:var(--mute)">' + esc(r.code) + " · " + esc(r.projeto) + '</span></span><span style="display:flex;flex-direction:column;gap:3px;font-size:13px;font-variant-numeric:tabular-nums"><span>' + esc(r.total) + '</span><span style="color:var(--mute)">' + esc(r.txt) + '</span></span><span style="display:flex;flex-direction:column;gap:7px"><span style="height:3px;background:var(--barBg)"><span style="display:block;height:100%;width:' + r.barW + ';background:var(--bar)"></span></span><span style="font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums">falta ' + esc(r.aberto) + '</span></span><span style="justify-self:end"><span style="font-size:11px;font-weight:600;padding:4px 8px;background:' + r.chipBg + ";color:" + r.chipFg + '">' + esc(r.chip) + "</span></span></button>";
    }).join("");
    return kpis + '<div style="display:flex;flex-direction:column">' + rows + "</div>";
  }

  function buildAgenda(V) {
    if (V.v_agCal) return buildAgCal(V);
    if (!V.agenda.length) return '<div style="padding:22px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)">Nenhum compromisso agendado.</div>';
    return '<div style="display:flex;flex-direction:column">' + V.agenda.map(function (m) {
      return '<div style="display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:14px;font-variant-numeric:tabular-nums">' + m.dia + " " + m.mes + '</span><span style="font-size:11px;color:var(--mute)">' + esc(m.semana) + " · " + esc(m.hora) + '</span></span><span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">' + esc(m.titulo) + '</span><span style="font-size:12px;color:var(--mute)">' + esc(m.cliente) + '</span></span><button ' + h(m.h) + ' style="border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer">Remover</button></div>';
    }).join("") + "</div>";
  }

  var DIAS_SEMANA_CURTO = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];

  function buildAgCal(V) {
    var nav = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px">'
      + '<button ' + h(V.calPrevH) + ' aria-label="Mês anterior" style="width:32px;height:32px;border:1px solid var(--line2);background:none;color:var(--ink);cursor:pointer">←</button>'
      + '<span style="display:flex;align-items:center;gap:12px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:15px">' + esc(V.calTitle) + '</span><button ' + h(V.calTodayH) + ' style="padding:6px 10px;border:1px solid var(--line2);background:none;color:var(--mute);font-size:11px;cursor:pointer">Hoje</button></span>'
      + '<button ' + h(V.calNextH) + ' aria-label="Próximo mês" style="width:32px;height:32px;border:1px solid var(--line2);background:none;color:var(--ink);cursor:pointer">→</button>'
      + "</div>";
    var head = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)">' + DIAS_SEMANA_CURTO.map(function (d) {
      return '<div style="background:var(--panel);padding:8px;text-align:center;font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)">' + d + "</div>";
    }).join("") + "</div>";
    var grid = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)">' + V.calCells.map(function (c) {
      if (c.blank) return '<div style="background:var(--bg);min-height:92px"></div>';
      var items = c.items.map(function (it) {
        return '<span style="display:block;font-size:10.5px;padding:2px 4px;background:var(--accSoft);color:var(--accTxt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(it.hora ? it.hora + " " + it.titulo : it.titulo) + "</span>";
      }).join("");
      return '<div style="background:var(--bg);min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px' + (c.isToday ? ";box-shadow:inset 0 0 0 1px var(--accTxt)" : "") + '"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:11px;color:' + (c.isToday ? "var(--accTxt)" : "var(--mute)") + '">' + c.d + "</span>" + items + "</div>";
    }).join("") + "</div>";
    return nav + head + grid;
  }

  function buildModelos(V) {
    var list = '<div style="display:flex;flex-direction:column">' + V.tplList.map(function (t) {
      return '<button ' + h(t.h) + ' style="display:flex;justify-content:space-between;gap:12px;padding:13px 12px;border:0;border-top:1px solid var(--line);border-left:2px solid ' + t.bd + ";background:" + t.bg + ';color:var(--ink);text-align:left;font:inherit;cursor:pointer"><span style="font-size:14px;font-weight:600">' + esc(t.nome) + '</span><span style="font-size:12px;color:var(--mute);white-space:nowrap">' + esc(t.meta) + "</span></button>";
    }).join("") + "</div>";
    var sel = "";
    if (V.hasTplSel) {
      var steps = V.tplSteps.map(function (s) {
        return '<div style="display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;color:var(--mute)">' + s.num + '</span><span style="font-size:14px">' + esc(s.t) + '</span><span style="display:flex;gap:2px"><button ' + h(s.upH) + ' aria-label="Subir" style="width:28px;height:28px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer">↑</button><button ' + h(s.downH) + ' aria-label="Descer" style="width:28px;height:28px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer">↓</button><button ' + h(s.delH) + ' aria-label="Remover" style="width:28px;height:28px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer">×</button></span></div>';
      }).join("");
      sel = '<div style="display:flex;flex-direction:column;gap:14px;grid-column:span 2;min-width:0">'
        + '<input value="' + esc(V.tplName) + '" data-ch="' + V.tplNameCh + '" style="background:transparent;border:0;border-bottom:1px solid var(--line2);color:var(--ink);padding:8px 0;font-family:\'Lexend Exa\',sans-serif;font-size:20px;letter-spacing:-.04em;outline:none">'
        + '<div style="display:flex;flex-direction:column">' + steps + "</div>"
        + '<div style="display:flex;gap:8px;flex-wrap:wrap"><input value="' + esc(V.newStep) + '" data-ch="' + V.newStepCh + '" data-kh="' + V.newStepKey + '" placeholder="Nova etapa" style="flex:1 1 220px;background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:10px 12px;font:inherit;font-size:13px;outline:none"><button ' + h(V.addStep) + ' style="padding:10px 14px;border:1px solid var(--line2);background:none;color:var(--ink);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer">Adicionar etapa</button></div>'
        + '<span style="font-size:12px;color:var(--mute)">Alterações valem para projetos novos. Projetos em andamento mantêm as etapas que já têm.</span>'
        + "</div>";
    }
    return '<p style="margin:0;font-size:14px;line-height:1.6;color:var(--mute);max-width:680px">Cada tipo de serviço segue um caminho próprio. Ajuste aqui as etapas e todo projeto novo daquele tipo já nasce com elas, sem precisar de programação.</p>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:32px;align-items:start">' + list + sel + "</div>";
  }

  function buildEquipe(V) {
    var users = '<div style="display:flex;flex-direction:column">' + V.users.map(function (u) {
      var avatar = u.avatarUrl ? '<img src="' + esc(u.avatarUrl) + '" alt="" style="width:100%;height:100%;object-fit:cover">' : esc(u.ini);
      return '<div style="display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)"><span style="width:32px;height:32px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accSoft);color:var(--accTxt);font-family:\'Lexend Exa\',sans-serif;font-size:11px">' + avatar + '</span><span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">' + esc(u.nome) + '</span><span style="font-size:12px;color:var(--mute)">' + esc(u.email) + " · " + esc(u.st) + '</span></span><span style="font-family:\'Lexend Exa\',sans-serif;font-size:11px;padding:5px 9px;border:1px solid var(--line2)">' + esc(u.papel) + "</span></div>";
    }).join("") + "</div>";
    var permHead = '<div style="display:grid;grid-template-columns:minmax(140px,1.4fr) repeat(4,minmax(90px,1fr));gap:10px;padding:10px 0;font-family:\'Lexend Exa\',sans-serif;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)"><span>Módulo</span>' + V.roles.map(function (r) { return '<span style="text-align:center">' + esc(r) + "</span>"; }).join("") + "</div>";
    var permRows = V.permRows.map(function (row) {
      return '<div style="display:grid;grid-template-columns:minmax(140px,1.4fr) repeat(4,minmax(90px,1fr));gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)"><span style="font-size:13px">' + esc(row.mod) + "</span>" + row.cells.map(function (c) {
        return '<button ' + h(c.h) + ' aria-label="Alternar permissão" style="justify-self:center;width:18px;height:18px;border:1px solid ' + c.bd + ";background:" + c.bg + ';color:var(--btnFg);font-size:11px;display:grid;place-items:center;padding:0;cursor:pointer">' + c.mark + "</button>";
      }).join("") + "</div>";
    }).join("");
    return users
      + '<section style="display:flex;flex-direction:column;gap:12px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase">Permissões por papel</span><span style="font-size:13px;color:var(--mute)">Quando a equipe crescer, cada pessoa entra com um papel e vê só os módulos liberados.</span>'
      + '<div style="overflow-x:auto"><div style="min-width:560px;display:flex;flex-direction:column">' + permHead + permRows + "</div></div></section>";
  }

  function buildAndamento(V) {
    var cp = V.cp;

      return '<div style="display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:14px"><span style="display:flex;flex-direction:column;align-items:center"><span style="width:11px;height:11px;margin-top:5px;flex:none;border:1px solid ' + t.dotBd + ";background:" + t.dotBg + '"></span><span style="flex:1;width:1px;background:var(--line2);min-height:22px"></span></span><span style="font-size:14px;padding-bottom:20px;color:' + t.color + '">' + esc(t.t) + '</span><span style="font-size:11px;color:' + t.stColor + '">' + esc(t.st) + "</span></div>";
    }).join("");
    return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px 56px;align-items:start">'
      + '<section style="display:flex;flex-direction:column;gap:20px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accTxt)">' + esc(cp.code) + " · " + esc(cp.tipo) + '</span><span style="font-family:\'Lexend Exa\',sans-serif;font-size:22px;letter-spacing:-.04em;line-height:1.25">' + esc(cp.nome) + '</span><span style="display:flex;align-items:center;gap:14px"><span style="flex:1;height:4px;background:var(--barBg)"><span style="display:block;height:100%;width:' + cp.barW + ';background:var(--bar);transition:width .6s"></span></span><span style="font-family:\'Lexend Exa\',sans-serif;font-size:13px;font-variant-numeric:tabular-nums">' + cp.pct + '%</span></span>'

  function buildDocumentos(V) {

      return '<div style="display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;color:var(--accTxt)">' + esc(d.tipo) + '</span><span style="font-size:14px">' + esc(d.nome) + '</span><span style="font-size:12px;color:var(--mute)">' + esc(d.data) + '</span><span style="font-family:\'Lexend Exa\',sans-serif;font-size:11px;color:var(--accTxt)">Baixar ↓</span></div>';
    }).join("") + "</div>";

  function buildCobrancas(V) {

      return '<div style="padding:18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">' + esc(s.label) + '</span><span style="font-family:\'Lexend Exa\',sans-serif;font-size:20px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:' + s.color + '">' + esc(s.val) + '</span><span style="font-size:12px;color:var(--mute)">' + esc(s.sub) + "</span></div>";

  function buildMensagens(V) {

      return '<div style="display:flex;flex-direction:column;align-items:' + m.align + ';gap:6px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;color:var(--mute)">' + esc(m.who) + " · " + esc(m.at) + '</span><span style="max-width:80%;padding:12px 15px;font-size:14px;line-height:1.55;background:' + m.bg + ";color:" + m.fg + '">' + esc(m.text) + "</span></div>";
    }).join("");
    return '<div style="display:flex;flex-direction:column;gap:14px;max-width:760px">' + msgs
      + '<div style="display:flex;gap:8px;margin-top:10px"><input value="' + esc(V.msgDraft) + '" data-ch="' + V.msgCh + '" data-kh="' + V.msgKey + '" placeholder="Escreva uma mensagem para a Lorena" style="flex:1;background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:13px;font:inherit;font-size:14px;outline:none"><button ' + h(V.sendMsg) + ' style="padding:13px 18px;border:0;background:var(--btnBg);color:var(--btnFg);font-family:\'Lexend Exa\',sans-serif;font-size:12px;cursor:pointer">Enviar</button></div></div>';
  }

  function buildSuporte(V) {
    return '<div style="display:flex;flex-direction:column">' + V.tickets.map(function (t) {
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line);flex-wrap:wrap"><span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">' + esc(t.titulo) + '</span><span style="font-size:12px;color:var(--mute)">Chamado #' + t.num + " · aberto " + esc(t.at) + '</span></span><span style="font-size:11px;font-weight:600;padding:4px 8px;background:' + t.chipBg + ";color:" + t.chipFg + '">' + esc(t.status) + "</span></div>";
    }).join("") + "</div>";
  }

  function buildMain(V) {
    var body = "";
    if (V.v_inicio) body = buildInicio(V);
    else if (V.v_projList) body = buildProjList(V);
    else if (V.v_projBoard) body = buildProjBoard(V);
    else if (V.v_projDet) body = buildProjDet(V);
    else if (V.v_clientes) body = buildClientes(V);
    else if (V.v_funil) body = buildFunil(V);
    else if (V.v_propostas) body = buildPropostas(V);
    else if (V.v_financeiro) body = buildFinanceiro(V);
    else if (V.v_agenda) body = buildAgenda(V);
    else if (V.v_modelos) body = buildModelos(V);
    else if (V.v_equipe) body = buildEquipe(V);
    else if (V.v_andamento) body = buildAndamento(V);
    else if (V.v_documentos) body = buildDocumentos(V);
    else if (V.v_cobrancas) body = buildCobrancas(V);
    else if (V.v_mensagens) body = buildMensagens(V);
    else if (V.v_suporte) body = buildSuporte(V);
    else if (V.v_prospeccao) body = buildProspeccao(V);
    return '<main style="min-width:0;padding:clamp(22px,3.4vw,44px) clamp(16px,3.6vw,52px) 120px;display:flex;flex-direction:column;gap:28px">' + buildHeader(V) + buildToolbar(V) + body + "</main>";
  }

  var BOT_ICON = '<svg viewBox="-20 10 390 460" style="width:100%;height:auto;overflow:visible;display:block"><line x1="76" y1="132" x2="18" y2="38" stroke="#457528" stroke-width="16" stroke-linecap="round"></line><line x1="246" y1="126" x2="292" y2="24" stroke="#457528" stroke-width="16" stroke-linecap="round"></line><circle cx="170" cy="283" r="172" fill="#defa9a"></circle><rect x="40" y="172" width="260" height="236" rx="104" fill="#0e0f0b"></rect><rect x="66" y="230" width="208" height="134" rx="67" fill="#defa9a"></rect><g style="transform-origin:170px 297px;animation:botBlink 4.2s infinite"><circle cx="122" cy="297" r="16" fill="#0e0f0b"></circle><circle cx="218" cy="297" r="16" fill="#0e0f0b"></circle></g></svg>';

  // Comemoração grande quando um lead/prospecção vira cliente de
  // verdade — bem mais festa que a meta semanal de prospecção, e o
  // próprio robô aparece dando parabéns (pedido da Lorena).
  function buildWinCelebration(V) {
    if (!V.clientWon) return "";
    var balloons = buildBalloons(28);
    var bubble = '<div style="position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:201;display:flex;flex-direction:column;align-items:center;gap:14px;animation:modIn .4s both">'
      + '<div style="max-width:min(420px,calc(100vw - 32px));padding:16px 20px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.3);text-align:center"><span style="display:block;font-family:\'Lexend Exa\',sans-serif;font-size:14px;margin-bottom:4px">Parabéns!</span><span style="font-size:13.5px;color:var(--ink2);line-height:1.5">' + esc(V.clientWon) + " virou cliente de verdade. Mais um negócio conquistado!</span></div>"
      + '<span style="width:84px;line-height:0;animation:botBob 2.4s ease-in-out infinite">' + BOT_ICON + "</span>"
      + "</div>";
    return '<div id="zCelebrateBig">' + balloons + "</div>" + bubble;
  }

  function buildBot(V) {
    if (!V.showBot) return "";
    var botIcon = BOT_ICON;
    var btn = '<button ' + h(V.toggleHelpH) + ' aria-label="Ajuda com o portal" style="position:fixed;right:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;font-family:\'Lexend Exa\',sans-serif;font-size:11px;box-shadow:0 14px 40px rgba(0,0,0,.25)"><span style="width:40px;line-height:0;animation:botBob 3.2s ease-in-out infinite">' + botIcon + "</span><span>" + esc(V.helpBtnLabel) + "</span></button>";
    var panel = "";
    if (V.helpOpen) {
      var log = V.helpLog.map(function (m) {
        return '<div style="display:flex;flex-direction:column;align-items:' + m.align + ';gap:8px"><span style="max-width:88%;padding:11px 13px;font-size:13.5px;line-height:1.55;background:' + m.bg + ";color:" + m.fg + ';white-space:pre-line">' + esc(m.text) + "</span>" + (m.hasGo ? '<button ' + h(m.goH) + ' style="padding:7px 11px;border:1px solid var(--line2);background:none;color:var(--accTxt);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer">' + esc(m.goLabel) + " →</button>" : "") + "</div>";
      }).join("");
      var sugg = V.helpSugg.map(function (s) { return '<button ' + h(s.h) + ' style="padding:7px 10px;border:1px solid var(--line2);background:none;color:var(--ink2);font-size:12px;cursor:pointer;text-align:left">' + esc(s.q) + "</button>"; }).join("");
      panel = '<div style="position:fixed;right:22px;bottom:92px;z-index:41;width:min(380px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.3)">'
        + '<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)"><span style="display:flex;flex-direction:column;gap:2px;flex:1"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:13px">Assistente do portal</span><span style="font-size:12px;color:var(--mute)">Explica como cada parte funciona</span></span><button ' + h(V.toggleHelpH) + ' aria-label="Fechar ajuda" style="border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;line-height:1">×</button></div>'
        + '<div id="helpLogEl" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">' + log + "</div>"
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px">' + sugg + "</div>"
        + '<div style="display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--line)"><input value="' + esc(V.helpDraft) + '" data-ch="' + V.helpChH + '" data-kh="' + V.helpKeyH + '" placeholder="Pergunte sobre o portal" style="flex:1;background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:10px 12px;font:inherit;font-size:13px;outline:none"><button ' + h(V.helpSendH) + ' style="padding:10px 13px;border:0;background:var(--btnBg);color:var(--btnFg);font-family:\'Lexend Exa\',sans-serif;font-size:11px;cursor:pointer">Enviar</button></div>'
        + "</div>";
    }
    return btn + panel;
  }

  function buildCmd(V) {
    if (!V.cmdOpen) return "";
    var res = V.cmdRes.map(function (r) {
      return '<button ' + h(r.h) + ' style="display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;padding:11px 18px;border:0;background:' + r.bg + ';color:var(--ink);text-align:left;font:inherit;cursor:pointer"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">' + esc(r.kind) + '</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px">' + esc(r.label) + '</span><span style="font-size:12px;color:var(--mute)">' + esc(r.sub) + "</span></span></button>";
    }).join("") + (V.cmdEmpty ? '<span style="padding:16px 18px;font-size:13px;color:var(--mute)">Nada encontrado.</span>' : "");
    return '<div data-h="' + V.closeCmdBgH + '" data-bg="1" style="position:fixed;inset:0;z-index:55;background:var(--overlay);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px">'
      + '<div style="width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.35)">'
      + '<input id="cmdInput" value="' + esc(V.cmdQ) + '" data-ch="' + V.cmdChH + '" data-kh="' + V.cmdKeyH + '" placeholder="Buscar cliente, projeto, proposta ou ação" style="width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:18px 18px;font:inherit;font-size:15px;outline:none">'
      + '<div style="display:flex;flex-direction:column;max-height:50vh;overflow-y:auto;padding:6px 0">' + res + "</div>"
      + '<div style="display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)"><span>Enter abre o primeiro</span><span>Esc fecha</span></div>'
      + "</div></div>";
  }

  function buildModal(V) {
    if (!V.modalOpen) return "";
    var fields = V.mFields.map(function (f) {
      var inner;
      var maskAttr = f.mask ? ' data-mask="1"' : "";
      if (f.isInput) inner = '<input type="' + f.type + '" value="' + esc(f.value) + '" data-ch="' + f.chH + '" data-field="' + esc(f.key || "") + '"' + maskAttr + ' placeholder="' + esc(f.ph) + '" style="background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:11px 13px;font:inherit;font-size:14px;outline:none;width:100%">';
      else if (f.isSelect) inner = '<select data-ch="' + f.chH + '" data-field="' + esc(f.key || "") + '" style="background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:11px;font:inherit;font-size:14px;width:100%">' + f.options.map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.v === f.value ? " selected" : "") + ">" + esc(o.l) + "</option>"; }).join("") + "</select>";
      else inner = '<textarea data-ch="' + f.chH + '" data-field="' + esc(f.key || "") + '" placeholder="' + esc(f.ph) + '" rows="4" style="background:var(--field);border:1px solid var(--line2);color:var(--ink);padding:11px 13px;font:inherit;font-size:14px;outline:none;width:100%;resize:vertical">' + esc(f.value) + "</textarea>";
      // Label termina em " *" pros campos obrigatórios (convenção já usada
      // em todo o código) — pinta só o asterisco de vermelho em vez de
      // deixar no mesmo cinza do resto do texto (pedido da Lorena).
      var labelText = f.label, reqMark = "";
      if (/\*\s*$/.test(labelText)) { labelText = labelText.replace(/\*\s*$/, "").trim(); reqMark = ' <span style="color:var(--badFg)">*</span>'; }
      return '<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)">' + esc(labelText) + reqMark + "</span>" + inner + "</label>";
    }).join("");
    var tplPrev = V.hasTplPreview ? '<div style="display:flex;flex-direction:column;gap:6px;padding:14px;border:1px dashed var(--line2)"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accTxt)">Etapas que serão criadas</span>' + V.tplPreview.map(function (t) { return '<span style="font-size:13px;color:var(--ink2)">' + esc(t) + "</span>"; }).join("") + "</div>" : "";
    var err = V.mErr ? '<span style="font-size:13px;color:var(--badFg)">' + esc(V.mErrMsg || "Preencha os campos marcados com *.") + "</span>" : "";
    var sub = V.hasMSub ? '<span style="font-size:12px;color:var(--mute)">' + esc(V.mSub) + "</span>" : "";
    var btns = (V.wShowBack ? '<button ' + h(V.wBackH) + ' style="padding:14px;border:1px solid var(--line2);background:none;color:var(--ink);font-family:\'Lexend Exa\',sans-serif;font-size:13px;cursor:pointer">← Voltar</button>' : "")
      + '<button ' + h(V.mSubmitH) + ' style="flex:1;padding:14px;border:0;background:var(--btnBg);color:var(--btnFg);font-family:\'Lexend Exa\',sans-serif;font-size:13px;cursor:pointer">' + esc(V.mSubmitLabel) + "</button>";
    return '<div data-h="' + V.closeModalBgH + '" style="position:fixed;inset:0;z-index:50;background:var(--overlay);backdrop-filter:blur(4px);display:flex;overflow-y:auto;padding:20px">'
      + '<div style="margin:auto;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);padding:clamp(22px,4vw,34px);display:flex;flex-direction:column;gap:18px">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><span style="display:flex;flex-direction:column;gap:4px"><span style="font-family:\'Lexend Exa\',sans-serif;font-size:18px;letter-spacing:-.04em">' + esc(V.mTitle) + "</span>" + sub + '</span><button ' + h(V.closeModalH) + ' aria-label="Fechar" style="border:0;background:none;color:var(--ink);font-size:22px;cursor:pointer;line-height:1">×</button></div>'
      + fields + tplPrev + err
      + '<div style="display:flex;gap:10px">' + btns + "</div>"
      + "</div></div>";
  }

  function buildToast(V) {
    if (!V.hasToast) return "";
    return '<div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;padding:12px 18px;background:var(--btnBg);color:var(--btnFg);font-size:14px;font-weight:600;animation:modIn .3s both">' + esc(V.toast) + "</div>";
  }

  function render() {
    // Antes disso, a página inteira era remontada (innerHTML) a cada
    // tecla digitada, o que derruba o foco do campo — sobrava só a
    // primeira letra digitada em qualquer input/textarea/select do
    // painel (bug real, achado pela Lorena no campo de telefone, mas
    // valia pra tudo). Guarda o campo focado antes de remontar, pelo
    // atributo estável data-field (campos de modal) ou data-ch (demais
    // inputs), e devolve o foco e a posição do cursor depois.
    var active = document.activeElement;
    var keep = null;
    if (active && app.contains(active) && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT")) {
      keep = {
        field: active.getAttribute("data-field"),
        ch: active.getAttribute("data-ch"),
        // Campo com máscara muda de tamanho a cada tecla (ex.: "11" vira
        // "(11) "), então a posição antiga do cursor não serve — fica
        // sempre no fim, que é onde quem está digitando normalmente quer.
        mask: active.hasAttribute("data-mask"),
        selStart: "selectionStart" in active ? active.selectionStart : null,
        selEnd: "selectionEnd" in active ? active.selectionEnd : null
      };
    }

    H = {}; HID = 0;
    var V = computeVals();
    document.body.dataset.theme = S.theme;
    app.innerHTML = '<div style="min-height:100vh;display:grid;grid-template-columns:' + V.shellCols + ';background:var(--bg)">' + buildAside(V) + buildMain(V) + "</div>" + buildBot(V) + buildCmd(V) + buildModal(V) + buildToast(V) + buildUserMenu(V) + buildWinCelebration(V);

    if (keep) {
      var back = (keep.field && app.querySelector('[data-field="' + keep.field + '"]')) || (keep.ch && app.querySelector('[data-ch="' + keep.ch + '"]'));
      if (back) {
        back.focus();
        if (keep.mask && typeof back.setSelectionRange === "function") {
          try { back.setSelectionRange(back.value.length, back.value.length); } catch (e) {}
        } else if (keep.selStart != null && typeof back.setSelectionRange === "function") {
          try { back.setSelectionRange(keep.selStart, keep.selEnd); } catch (e) {}
        }
      }
    }

    app.querySelectorAll("[data-h]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (el.hasAttribute("data-bg") && e.target !== el) return;
        var fn = H[el.getAttribute("data-h")];
        if (fn) fn(e);
      });
    });
    app.querySelectorAll("[data-ch]").forEach(function (el) {
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", function (e) {
        var fn = H[el.getAttribute("data-ch")];
        if (fn) fn(e);
      });
    });
    app.querySelectorAll("[data-kh]").forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        var fn = H[el.getAttribute("data-kh")];
        if (fn) fn(e);
      });
    });
    // Salva sozinho ao sair do campo de texto (sem precisar de botão
    // "Salvar" nem de um modo de edição separado — ex.: ficha da
    // prospecção).
    app.querySelectorAll("[data-blurh]").forEach(function (el) {
      el.addEventListener("blur", function (e) {
        var fn = H[el.getAttribute("data-blurh")];
        if (fn) fn(e);
      });
    });
    app.querySelectorAll("[data-fileh]").forEach(function (el) {
      el.addEventListener("change", function (e) {
        var fn = H[el.getAttribute("data-fileh")];
        if (fn) fn(e);
      });
    });
  }

  window.addEventListener("resize", function () { S.w = window.innerWidth; render(); });
  window.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && S.role === "admin") {
      e.preventDefault();
      S.cmdOpen = true; S.cmdQ = ""; render(); focusCmd();
    }
    if (e.key === "Escape") { S.cmdOpen = false; S.modal = null; S.helpOpen = false; S.userMenuOpen = false; render(); }
  });

  async function boot() {
    var sessRes = await sb().auth.getSession();
    if (!sessRes.data.session) { window.location.href = "login.html"; return; }
    // Cliente com senha temporária (gerada pela Lorena pro "kit de
    // boas-vindas") é obrigado a trocar antes de ver qualquer coisa do
    // portal — a flag é limpa só quando ele de fato salva a senha nova
    // em set-password.html.
    if ((sessRes.data.session.user.user_metadata || {}).must_change_password) { window.location.href = "set-password.html"; return; }
    var email = sessRes.data.session.user.email;
    var uid = sessRes.data.session.user.id;
    var adminRes = await sb().rpc("is_admin");
    var role = adminRes.data ? "admin" : "client";
    try {
      var D = await loadAll(role, email);
      S.role = role; S.email = email; S.uid = uid; S.data = D; S.view = role === "admin" ? "inicio" : "andamento";
      // Admin tem foto guardada em admins.avatar_url (visível pra equipe
      // toda em "Equipe e permissões"). Cliente não aparece pra mais
      // ninguém, então a própria foto fica só no metadata da conta.
      S.clientAvatarUrl = (sessRes.data.session.user.user_metadata || {}).avatar_url || "";
      document.body.dataset.theme = S.theme;
      render();
    } catch (err) {
      console.error("[Buovai] Falha ao carregar o portal:", err);
      app.innerHTML = '<div id="bootMsg">Não foi possível carregar o portal agora. Atualize a página em instantes.</div>';
    }
  }

  sb().auth.onAuthStateChange(function (event) {
    if (event === "SIGNED_OUT") window.location.href = "login.html";
  });

  boot();
})();
</script>
</body>
