<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Painel Buovai</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="painel.css" />
  <link rel="icon" type="image/png" href="../assets/img/logo-mark.png" />
</head>
<body>
  <div class="panel-shell">
    <header class="panel-topbar">
      <a href="../index.html" class="panel-topbar__brand">
        <img src="../assets/img/logo-mark.png" alt="" aria-hidden="true" />
        <span>Buovai</span>
      </a>
      <div class="panel-topbar__user">
        <span id="user-email"></span>
        <a href="index.html" class="btn btn-ghost btn-sm">Ver como cliente</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
      </div>
    </header>

    <main class="panel-main" id="main-content" style="max-width: 1180px;">
      <div class="panel-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
          <p class="panel-eyebrow">Administração</p>
          <h1>Projetos de clientes</h1>
        </div>
        <button class="btn btn-sm" id="new-project-btn">+ Novo projeto</button>
      </div>

      <div id="new-project-form-wrap" hidden style="margin-bottom:2rem;">
        <div class="admin-panel">
          <h2 style="font-size:1.05rem;">Novo projeto</h2>
          <form id="new-project-form" class="form-grid form-grid--cols2">
            <div class="field">
              <label for="np-client-name">Nome do cliente</label>
              <input id="np-client-name" required />
            </div>
            <div class="field">
              <label for="np-client-email">E-mail de acesso do cliente</label>
              <input id="np-client-email" type="email" required />
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label for="np-title">Título do projeto</label>
              <input id="np-title" required />
            </div>
            <div style="grid-column: 1 / -1; display:flex; gap:0.75rem;">
              <button type="submit" class="btn btn-sm">Criar projeto</button>
              <button type="button" class="btn btn-ghost btn-sm" id="cancel-new-project">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="admin-layout">
        <div class="admin-list" id="admin-project-list">
          <div class="admin-list__item"><span>Carregando...</span></div>
        </div>
        <div class="admin-panel" id="admin-detail">
          <p style="color:var(--ink-muted);">Selecione um projeto na lista para gerenciar etapas e entregas.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (function () {
      "use strict";

      var DEFAULT_STAGES = ["Diagnóstico e alinhamento", "Arquitetura definida", "Em desenvolvimento", "Em testes", "Entregue"];
      var PROJECT_STATUS_LABELS = { em_andamento: "Em andamento", pausado: "Pausado", concluido: "Concluído" };

      var projects = [];
      var activeProjectId = null;

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.textContent = str == null ? "" : str;
        return div.innerHTML;
      }

      function fmtDate(iso) {
        if (!iso) return "";
        return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
      }

      async function boot() {
        var { data: sessionData } = await window.buovaiClient.auth.getSession();
        var session = sessionData.session;
        if (!session) { window.location.href = "login.html"; return; }

        document.getElementById("user-email").textContent = session.user.email || "";

        var { data: isAdmin } = await window.buovaiClient.rpc("is_admin");
        if (!isAdmin) { window.location.href = "index.html"; return; }

        await loadProjectList();
      }

      async function loadProjectList() {
        var listEl = document.getElementById("admin-project-list");
        var { data, error } = await window.buovaiClient.from("client_projects").select("*").order("created_at", { ascending: false });

        if (error) {
          listEl.innerHTML = '<div class="admin-list__item"><span>Erro ao carregar projetos.</span></div>';
          return;
        }

        projects = data || [];

        if (!projects.length) {
          listEl.innerHTML = '<div class="admin-list__item"><span>Nenhum projeto cadastrado ainda.</span></div>';
          return;
        }

        listEl.innerHTML = projects
          .map(function (p) {
            return (
              '<button type="button" class="admin-list__item' + (p.id === activeProjectId ? " is-active" : "") + '" data-id="' + p.id + '">' +
                "<strong>" + escapeHtml(p.project_title) + "</strong>" +
                "<span>" + escapeHtml(p.client_name) + " · " + (PROJECT_STATUS_LABELS[p.status] || p.status) + "</span>" +
              "</button>"
            );
          })
          .join("");

        listEl.querySelectorAll(".admin-list__item[data-id]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            activeProjectId = btn.getAttribute("data-id");
            loadProjectList();
            renderDetail(activeProjectId);
          });
        });
      }

      async function renderDetail(projectId) {
        var detailEl = document.getElementById("admin-detail");
        var project = projects.find(function (p) { return p.id === projectId; });
        if (!project) return;

        detailEl.innerHTML = '<p style="color:var(--ink-muted);">Carregando...</p>';

        var [{ data: stages }, { data: deliveries }] = await Promise.all([
          window.buovaiClient.from("project_stages").select("*").eq("project_id", projectId).order("order_index", { ascending: true }),
          window.buovaiClient.from("project_deliveries").select("*").eq("project_id", projectId).order("delivered_at", { ascending: false }),
        ]);

        var stagesHtml = (stages || [])
          .map(function (s) {
            return (
              '<div class="admin-stage-row" data-stage-id="' + s.id + '">' +
                '<span class="admin-stage-row__title">' + escapeHtml(s.title) + "</span>" +
                '<select data-field="status">' +
                  ["pendente", "em_andamento", "concluido"].map(function (v) {
                    return '<option value="' + v + '"' + (s.status === v ? " selected" : "") + ">" + v.replace("_", " ") + "</option>";
                  }).join("") +
                "</select>" +
              "</div>"
            );
          })
          .join("");

        var deliveriesHtml = (deliveries || [])
          .map(function (d) {
            return (
              '<div class="delivery-item">' +
                '<div class="delivery-item__top"><span>' + escapeHtml(d.title) + '</span><span class="delivery-item__date">' + fmtDate(d.delivered_at) + "</span></div>" +
                (d.description ? "<p>" + escapeHtml(d.description) + "</p>" : "") +
              "</div>"
            );
          })
          .join("");

        detailEl.innerHTML =
          "<h2>" + escapeHtml(project.project_title) + "</h2>" +
          '<p style="color:var(--ink-muted); font-size:0.9rem; margin-top:0.35rem;">' + escapeHtml(project.client_name) + " · " + escapeHtml(project.client_email) + "</p>" +
          '<div class="field" style="margin-top:1.25rem; max-width:240px;">' +
            "<label>Status do projeto</label>" +
            '<select id="project-status-select">' +
              ["em_andamento", "pausado", "concluido"].map(function (v) {
                return '<option value="' + v + '"' + (project.status === v ? " selected" : "") + ">" + PROJECT_STATUS_LABELS[v] + "</option>";
              }).join("") +
            "</select>" +
          "</div>" +
          '<div class="section-divider"><h3>Etapas</h3></div>' +
          (stagesHtml || '<p style="color:var(--ink-muted); font-size:0.88rem;">Sem etapas cadastradas.</p>') +
          '<div class="section-divider"><h3>Nova entrega</h3></div>' +
          '<form class="inline-form" id="new-delivery-form">' +
            '<input type="text" id="delivery-title" placeholder="Título da entrega" required />' +
            '<input type="text" id="delivery-desc" placeholder="Descrição (opcional)" />' +
            '<button type="submit" class="btn btn-sm">Adicionar</button>' +
          "</form>" +
          '<div class="section-divider"><h3>Histórico de entregas</h3></div>' +
          (deliveriesHtml || '<p style="color:var(--ink-muted); font-size:0.88rem;">Nenhuma entrega ainda.</p>');

        detailEl.querySelector("#project-status-select").addEventListener("change", async function (e) {
          await window.buovaiClient.from("client_projects").update({ status: e.target.value }).eq("id", projectId);
          await loadProjectList();
        });

        detailEl.querySelectorAll(".admin-stage-row select").forEach(function (sel) {
          sel.addEventListener("change", async function () {
            var row = sel.closest(".admin-stage-row");
            var stageId = row.getAttribute("data-stage-id");
            var payload = { status: sel.value };
            if (sel.value === "concluido") payload.completed_at = new Date().toISOString();
            await window.buovaiClient.from("project_stages").update(payload).eq("id", stageId);
          });
        });

        detailEl.querySelector("#new-delivery-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          var title = document.getElementById("delivery-title").value.trim();
          var desc = document.getElementById("delivery-desc").value.trim();
          if (!title) return;
          await window.buovaiClient.from("project_deliveries").insert({ project_id: projectId, title: title, description: desc || null });
          renderDetail(projectId);
        });
      }

      // ---- Novo projeto ----
      var newProjectBtn = document.getElementById("new-project-btn");
      var newProjectWrap = document.getElementById("new-project-form-wrap");
      newProjectBtn.addEventListener("click", function () {
        newProjectWrap.hidden = !newProjectWrap.hidden;
      });
      document.getElementById("cancel-new-project").addEventListener("click", function () {
        newProjectWrap.hidden = true;
      });

      document.getElementById("new-project-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var clientName = document.getElementById("np-client-name").value.trim();
        var clientEmail = document.getElementById("np-client-email").value.trim();
        var title = document.getElementById("np-title").value.trim();
        if (!clientName || !clientEmail || !title) return;

        var { data: created, error } = await window.buovaiClient
          .from("client_projects")
          .insert({ client_name: clientName, client_email: clientEmail, project_title: title })
          .select()
          .single();

        if (error || !created) {
          alert("Não foi possível criar o projeto. Tente de novo.");
          return;
        }

        var stageRows = DEFAULT_STAGES.map(function (title, i) {
          return { project_id: created.id, title: title, order_index: i };
        });
        await window.buovaiClient.from("project_stages").insert(stageRows);

        document.getElementById("new-project-form").reset();
        newProjectWrap.hidden = true;
        activeProjectId = created.id;
        await loadProjectList();
        renderDetail(created.id);
      });

      document.getElementById("logout-btn").addEventListener("click", async function () {
        await window.buovaiClient.auth.signOut();
        window.location.href = "login.html";
      });

      boot();
    })();
  </script>
</body>
</html>
